[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finrag"
version = "0.1.0"
description = "FinSolve ABAC RAG rebuild: graded evals, hybrid retrieval, graph RAG."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "numpy",
    "bm25s",
]

[project.scripts]
finrag = "finrag.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]
ml = ["sentence-transformers"]
vertex = ["google-genai"]
ui = ["streamlit", "pyvis", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]
