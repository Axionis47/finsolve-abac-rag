version: 0.1
name: FinSolve RAG Chatbot ABAC Policy
last_updated: 2025-09-22

# Roles are constrained to those in the problem statement (no extras)
roles:
  - finance
  - marketing
  - hr
  - engineering
  - c_level
  - employee

# Actions we check with the PDP
actions:
  - retrieve_chunk      # retrieve text chunks for RAG context
  - view_source         # expose human-readable citations
  - view_row            # row-level access (HR CSV)
  - aggregate_query     # request for safe aggregates only

# Resource attributes used for decisions (attached as metadata to chunks/rows)
resource_attributes:
  owner_dept: [engineering, finance, marketing, hr, general]
  doc_type: [md, csv, aggregate]
  sensitivity: [general, internal, confidential, restricted]
  section_path: string
  source_path: string
  year: ["int", null]
  quarter: [Q1, Q2, Q3, Q4, null]
  row_id: ["string", null]
  pii_fields_present: ["bool", null]

# Global toggles (change via configuration, not code)
flags:
  hr_aggregate_mode: disabled   # disabled by default; if enabled, non-HR can receive safe summaries only

# Default decision is deny unless a rule matches (least privilege)
default: deny

# Rules are evaluated top → bottom; first match wins
rules:
  # 0) C-Level: full access
  - name: c_level_full_access
    when:
      all:
        - eq: [subject.role, c_level]
    effect: permit

  # 1) General corpus is available to all roles
  - name: general_docs_any_role
    when:
      all:
        - eq: [resource.owner_dept, general]
        - in: [action, [retrieve_chunk, view_source]]
    effect: permit

  # 2) Departmental access to internal documents (Markdown)
  - name: same_department_internal_docs
    when:
      all:
        - eq: [resource.doc_type, md]
        - in: [resource.sensitivity, [general, internal]]
        - eq: [subject.role, resource.owner_dept]
        - in: [action, [retrieve_chunk, view_source]]
    effect: permit

  # 3) Employee role has access to general only (already covered by rule #1). Explicitly deny others for clarity.
  - name: employee_non_general_deny
    when:
      all:
        - eq: [subject.role, employee]
        - ne: [resource.owner_dept, general]
    effect: deny

  # 4) Cross-department reads are denied by default
  - name: cross_department_deny
    when:
      all:
        - eq: [resource.doc_type, md]
        - not_in: [subject.role, [c_level]]
        - ne: [subject.role, resource.owner_dept]
        - ne: [resource.owner_dept, general]
    effect: deny

  # 5) HR CSV rows: HR and C-Level, for search as well as for opening the row.
  #
  # Why retrieve_chunk and view_source sit here next to view_row: the searchable
  # text of a row is PII-free by construction (see ingest/hr_csv.py, which puts
  # only name, role, department and location in `text`). The PII itself lives in
  # the row payload, and the payload is still gated on view_row alone. So HR can
  # find its own rows, and nothing sensitive rides along with the finding.
  - name: hr_rows_hr_and_c_level_only
    when:
      all:
        - eq: [resource.owner_dept, hr]
        - eq: [resource.doc_type, csv]
        - in: [action, [retrieve_chunk, view_source, view_row]]
        - in: [subject.role, [hr, c_level]]
    effect: permit

  # 6) Non-HR cannot touch HR rows at all (explicit). The action list mirrors
  # rule 5 exactly, so the two rules always cover the same ground.
  - name: non_hr_hr_rows_deny
    when:
      all:
        - eq: [resource.owner_dept, hr]
        - eq: [resource.doc_type, csv]
        - in: [action, [retrieve_chunk, view_source, view_row]]
        - not_in: [subject.role, [hr, c_level]]
    effect: deny

  # 7) Optional: HR aggregates for non-HR (only if flag enabled)
  - name: hr_aggregates_non_hr_if_enabled
    when:
      all:
        - eq: [flags.hr_aggregate_mode, enabled]
        - eq: [resource.owner_dept, hr]
        - eq: [resource.doc_type, aggregate]
        - in: [action, [retrieve_chunk, view_source, aggregate_query]]
        - not_in: [subject.role, [hr, c_level]]
    effect: permit

  # 8) HR aggregates always permitted to HR and C-Level
  - name: hr_aggregates_hr_and_c_level
    when:
      all:
        - eq: [resource.owner_dept, hr]
        - eq: [resource.doc_type, aggregate]
        - in: [action, [retrieve_chunk, view_source, aggregate_query]]
        - in: [subject.role, [hr, c_level]]
    effect: permit

  # 9) Confidential or restricted materials in Markdown (none currently) deny unless same dept and explicit allow
  - name: high_sensitivity_md_deny_by_default
    when:
      all:
        - eq: [resource.doc_type, md]
        - in: [resource.sensitivity, [confidential, restricted]]
        - not_in: [subject.role, [c_level]]
    effect: deny

# allowed_roles_computation: DOCUMENTATION ONLY.
#
# This block is a comment, not data. No code reads it. Ingest computes
# allowed_roles by calling PolicyEngine.allowed_roles(), which asks the rules
# above with action = retrieve_chunk, once per role. What follows is simply the
# answer that loop gives today, written out so a reader does not have to
# simulate the rule order in their head. If the two ever disagree, the rules
# are right and this block is stale.
#
#   owner_dept == general
#     -> finance, marketing, hr, engineering, c_level, employee   (rule 1)
#   doc_type == md, sensitivity in [general, internal]
#     -> the owning department, plus c_level                      (rules 0, 2)
#   doc_type == md, sensitivity in [confidential, restricted]
#     -> c_level only; even the owning department loses it        (rules 0, 9)
#   doc_type == csv, owner_dept == hr        (the HR employee rows)
#     -> hr, c_level                                              (rules 0, 5)
#   doc_type == aggregate, owner_dept == hr  (the five HR summaries)
#     -> hr, c_level, plus the other departments when the
#        hr_aggregate_mode flag is enabled at runtime             (rules 0, 7, 8)
#   anything else (attributes no rule was written for)
#     -> c_level only, by the default deny                        (rule 0)
#
# employee never appears outside the general row: rule 3 cuts it off first.

notes:
  - Ownership is determined by the source file’s department folder today; cross-mentions
    (e.g., finance discussing marketing spend) do not change owner_dept.
  - HR CSV contains PII; treat the whole row as restricted. Only HR and C-Level may retrieve
    a row at all, and only they may open its payload via view_row. Other roles never see a
    row, in search results or anywhere else.
  - General docs are considered non-sensitive internal information suitable for all roles.
